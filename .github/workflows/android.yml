name: CleanX Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CleanX-Android-2.1.0-Liquid-Glass
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="cleanx-v2.1.0"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "CleanX v2.1.0 Liquid Glass" --notes "CleanX 2.1.0 - Prismal liquid glass material and refined motion."
          gh release upload "$TAG" app/build/outputs/apk/debug/app-debug.apk#CleanX-v2.1.0.apk --repo "$GITHUB_REPOSITORY" --clobber
