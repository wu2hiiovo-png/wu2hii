name: CleanX Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: toolbox-3.8-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wu2hii-Toolbox-3.8.0
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="wu2hii-toolbox-v3.8.0"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "wu2hii Toolbox v3.8.0" --notes "wu2hii Toolbox 3.8.0 - top-right settings entry, icon/text color and opacity controls, and custom wallpaper settings."
          gh release delete-asset "$TAG" wu2hii-Toolbox-3.4.0.apk --repo "$GITHUB_REPOSITORY" --yes >/dev/null 2>&1 || true
          cp app/build/outputs/apk/debug/app-debug.apk wu2hii-Toolbox-3.7.0.apk
          gh release delete-asset "$TAG" app-debug.apk --repo "$GITHUB_REPOSITORY" --yes >/dev/null 2>&1 || true
          gh release upload "$TAG" wu2hii-Toolbox-3.7.0.apk --repo "$GITHUB_REPOSITORY" --clobber
